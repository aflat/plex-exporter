# Fork-only workflow: builds .deb packages (binary + systemd unit) for
# installing on a plain Debian/Ubuntu host or LXC. Not synced from cplieger/ci.
#
# Push a tag like deb-v4.4.0 to publish a GitHub release with the packages.
# Every push to main, and a manual run (Actions -> Debian package -> Run
# workflow), only builds them as a workflow artifact.
name: Debian package

on:
  push:
    branches: [main]
    tags: ["deb-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release binaries are built from a clean module cache.
          cache: false

      - name: Build package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#deb-v}"
          else
            version="0.0.0~git$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"
          fi
          sh packaging/build-deb.sh "$version" "$ARCH"
          # Stable name so releases/latest/download/<name> always works.
          cp dist/plex-exporter_*_"$ARCH".deb "dist/plex-exporter_linux_$ARCH.deb"
          dpkg-deb --info "dist/plex-exporter_linux_$ARCH.deb"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Install: apt install ./plex-exporter_linux_amd64.deb"
